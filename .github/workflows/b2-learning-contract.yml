name: B2 learning studio · static contract

on:
  pull_request:
    paths:
      - 'gramatika/ibilbidea/**'
      - 'sw.js'
      - 'tests/b2-learning-studio.test.mjs'
      - '.github/workflows/b2-learning-contract.yml'
  push:
    branches: [main]
    paths:
      - 'gramatika/ibilbidea/**'
      - 'sw.js'
      - 'tests/b2-learning-studio.test.mjs'
      - '.github/workflows/b2-learning-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check learning studio contract
        run: node --test tests/b2-learning-studio.test.mjs
